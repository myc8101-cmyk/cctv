<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 390px 미리보기 (임시)</title>
<style>
  html,body{margin:0;background:#5b6474;}
  .wrap{display:flex;justify-content:center}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="f" src="./index.html?preview=1" title="CCTV 견적 계산기 390px 미리보기"></iframe>
</div>
<script>
  document.getElementById('f').addEventListener('load', function () {
    try {
      var d = this.contentDocument;
      var card = d.querySelector('.sum-card');
      if (card) card.scrollIntoView({ block: 'center' });
    } catch (e) {}
  });
</script>
</body>
</html>
